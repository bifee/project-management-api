# ===================================
# SERVER
# ===================================
server.port=8080
spring.application.name=project-management-api

# ===================================
# POSTGRESQL DATABASE
# ===================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/project_management}
spring.datasource.username=${DB_USERNAME:project_user}
spring.datasource.password=${DB_PASSWORD:project_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================
# JPA / HIBERNATE
# ===================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# ===================================
# JWT SECRET
# ===================================
api.security.token.secret=${JWT_SECRET:meu-segredo-super-secreto-jwt-2026}

# ===================================
# LOGGING
# ===================================
logging.level.org.springframework.security=INFO
logging.level.com.bifee.projectmanagement=DEBUG

services:
  postgres:
    image: postgres:16
    container_name: project-management-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: project_management
      POSTGRES_USER: project_user
      POSTGRES_PASSWORD: project_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: